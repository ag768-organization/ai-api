[project]
name = "ai-api"
version = "0.1.0"
description = "A fake per-token AI API used to practice change-management and billing controls."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["billing", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
